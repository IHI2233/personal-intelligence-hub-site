name: Process submitted article URL
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: url-intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  process:
    if: github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[URL]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process public URL and create Notion draft
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/process_url_intake.py
      - name: Publish task status for the dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tasks.json
          if git diff --cached --quiet; then
            echo "No task status changes."
            exit 0
          fi
          git commit -m "chore: publish URL intake task status"
          git fetch origin main
          git rebase origin/main
          git push
